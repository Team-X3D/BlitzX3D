name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: "2.0.0"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install required VS workloads (MFC/ATL v143)
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS install path: $vsPath"
          Start-Process -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" -ArgumentList `
            "modify", "--installPath", "`"$vsPath`"", `
            "--add", "Microsoft.VisualStudio.Component.VC.ATLMFC", `
            "--add", "Microsoft.VisualStudio.Component.VC.ATL", `
            "--quiet", "--norestart", "--wait" `
            -Wait -PassThru | Select-Object -ExpandProperty ExitCode

      - name: Create cryptseed.h
        shell: pwsh
        run: |
          Copy-Item "linker\cryptseed.h.example" "linker\cryptseed.h"
          $seedHex = "0x{0:X8}u" -f (1000000000 + ${env:GITHUB_RUN_NUMBER})
          (Get-Content "linker\cryptseed.h") -replace 'RUNTIME_KEY_SEED = 0x[0-9A-Fa-f]+u', "RUNTIME_KEY_SEED = $seedHex" | Set-Content "linker\cryptseed.h"

      - name: Restore NuGet packages
        run: nuget restore blitz3d.sln
        continue-on-error: true

      - name: Build solution (Release)
        run: msbuild blitz3d.sln /p:Configuration=Release /m /v:minimal

      - name: Package build
        shell: pwsh
        run: Compress-Archive -Path "_release\*" -DestinationPath "BlitzX3D-${{ env.RELEASE_VERSION }}-Test${{ github.run_number }}.zip" -Force

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: BlitzX3D-${{ env.RELEASE_VERSION }}-Test${{ github.run_number }}
          path: BlitzX3D-*.zip
          if-no-files-found: warn

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test${{ github.run_number }}
          name: Test${{ github.run_number }} ${{ env.RELEASE_VERSION }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: BlitzX3D-*.zip
